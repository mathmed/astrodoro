name: checks

# Every check, on every interpreter and every platform the project claims to
# support. Called by ci on each push and by release before anything is
# published. It is one workflow because a tag can be cut from anywhere, and a
# release that skipped a check is worse than a slow one.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

jobs:
  checks:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor from pyproject and the two above it. The floor is the one
          # that matters: numpy resolves to a different version there, and its
          # stubs are stricter — three real type errors only showed up on 3.11.
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          # The platforms the release ships a bundle for.
          - { os: macos-14, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Qt needs these even in offscreen mode, which is how the GUI tests run.
      - name: system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: vulture
        run: vulture

      - name: bandit
        run: bandit -c pyproject.toml -r src/astrodoro -ll -q

      - name: xenon
        run: xenon src/astrodoro --max-absolute F --max-modules B --max-average A

      # Not pinned to one interpreter on purpose: the installed stubs follow
      # the interpreter, so this is the only way to see what each one sees.
      - name: mypy
        run: mypy

      - name: the catalogue has to match the code
        run: python scripts/i18n.py check

      # No camera, no phone, no network and no vendor dylib: the driver loads
      # its SDK on first use, and the catalogue comes from tests/data.
      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
