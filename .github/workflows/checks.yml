name: checks

# Every check, on every interpreter and every platform the project claims to
# support. Called by ci on each push and by release before anything is
# published. It is one workflow because a tag can be cut from anywhere, and a
# release that skipped a check is worse than a slow one.
#
# Each check runs through scripts/quality_report.py, which keeps the tool's
# exit code — the step is still the gate — and saves its output as a fragment
# (the quality-fragment-checks-* artifacts). On a pull request, the
# quality-report job in ci.yml turns them into one comment. A failing check no
# longer hides the ones after it: they still run, so the report is complete,
# and the job fails all the same.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

jobs:
  checks:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor from pyproject and the two above it. The floor is the one
          # that matters: numpy resolves to a different version there, and its
          # stubs are stricter — three real type errors only showed up on 3.11.
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          # The platforms the release ships a bundle for.
          - { os: macos-14, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    # One shell everywhere, so `--` reaches quality_report.py on Windows too.
    defaults:
      run:
        shell: bash
    env:
      QUALITY_PLATFORM: ${{ matrix.os }} · py${{ matrix.python }}
      REPORT: python scripts/quality_report.py run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Qt needs these even in offscreen mode, which is how the GUI tests run.
      - name: system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: install
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: $REPORT ruff-check -- ruff check src tests scripts

      - name: ruff format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: $REPORT ruff-format -- ruff format --check src tests scripts

      - name: vulture
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: $REPORT vulture -- vulture

      - name: bandit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: $REPORT bandit -- bandit -c pyproject.toml -r src/astrodoro -ll -q

      - name: xenon
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          $REPORT xenon --
          xenon src/astrodoro --max-absolute F --max-modules B --max-average A

      # Not pinned to one interpreter on purpose: the installed stubs follow
      # the interpreter, so this is the only way to see what each one sees.
      - name: mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: $REPORT mypy -- mypy

      # The layering in CONTRIBUTING.md, as contracts in pyproject.toml.
      - name: import-linter
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: $REPORT import-linter -- lint-imports

      - name: the catalogue has to match the code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: $REPORT catalogue -- python scripts/i18n.py check

      # No camera, no phone, no network and no vendor dylib: the driver loads
      # its SDK on first use, and the catalogue comes from tests/data. The
      # coverage is reported, not enforced.
      - name: pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: $REPORT pytest -- pytest --cov=astrodoro --cov-report=term

      # Boots what a user starts — the CLI, a replayed session through the
      # whole pipeline, the GUI offscreen — instead of importing pieces of it,
      # on every platform a bundle ships for.
      - name: smoke
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 15
        run: $REPORT smoke -- python scripts/smoke.py

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-checks-${{ matrix.os }}-py${{ matrix.python }}
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7
