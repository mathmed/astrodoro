name: mutation

# Mutation testing of the whole [tool.mutmut] scope in pyproject.toml: the
# decision logic, not the pixel pipeline, the drivers or the front ends. Weekly
# and on demand; it measures how well the tests pin those rules down and
# reports, it does not gate. Pull requests run the cheap version instead: the
# `mutation` job in ci.yml mutates only the functions they changed. Read the
# job summary, or the mutation-report artifact for the diffs of the survivors.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      min_score:
        description: "Fail the run below this mutation score (0 only reports)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    # mutmut forks for every mutant, so no Windows; one Linux run is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: mutmut run
        env:
          QT_QPA_PLATFORM: offscreen
        run: mutmut run --max-children "$(nproc)"

      - name: report
        if: ${{ !cancelled() }}
        env:
          MIN_SCORE: ${{ inputs.min_score || '0' }}
        run: |
          python scripts/mutation.py report --min-score "$MIN_SCORE" \
            > mutation-report.md || EXIT=$?
          # The job summary has a size limit: the tables go there, the diffs
          # of the survivors stay in the artifact.
          sed '/^### Surviving mutants/,$d' mutation-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "Surviving mutants with their diffs: the mutation-report artifact." \
            >> "$GITHUB_STEP_SUMMARY"
          mutmut export-cicd-stats || true
          exit "${EXIT:-0}"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: |
            mutation-report.md
            mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore
