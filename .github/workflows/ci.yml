name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The wheel is where a packaging mistake shows up: the data files live
      # inside the package and .gitignore decides what hatchling ships.
      - name: build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: the package data has to be in it
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for want in ("astrodoro/ui/web/handset.html",
                       "astrodoro/ui/assets/icon.png",
                       "astrodoro/i18n/astrodoro.pot"):
              assert want in names, f"{want} missing from the wheel"
          print(f"{len(names)} files, package data present")
          PY
