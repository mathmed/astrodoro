name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt needs these even in offscreen mode, which is how the GUI tests run.
      - name: system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: lint
        run: |
          ruff check src tests scripts
          python scripts/extract_messages.py --check

      - name: test
        env:
          QT_QPA_PLATFORM: offscreen
        # The camera driver needs a vendor dylib that is not redistributable, so
        # any test that would touch it is skipped by not having hardware here.
        run: pytest
