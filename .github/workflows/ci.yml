name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject and the two above it. The floor is the one
        # that matters: it is what a user on an older macOS will have.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Qt needs these even in offscreen mode, which is how the GUI tests run.
      - name: system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          vulture
          bandit -c pyproject.toml -r src/astrodoro -ll -q
          xenon src/astrodoro --max-absolute F --max-modules B --max-average A
          mypy
          python scripts/i18n.py check

      # No camera, no phone, no network and no vendor dylib: the driver loads
      # its SDK on first use, so importing it here is fine, and the catalogue
      # comes from tests/data rather than from a download.
      - name: test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The wheel is where a packaging mistake shows up: the data files live
      # inside the package and .gitignore decides what hatchling ships.
      - name: build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: the package data has to be in it
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for want in ("astrodoro/ui/web/handset.html",
                       "astrodoro/ui/assets/icon.png",
                       "astrodoro/i18n/astrodoro.pot"):
              assert want in names, f"{want} missing from the wheel"
          print(f"{len(names)} files, package data present")
          PY
