name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (it must already exist)"
        required: true

permissions:
  contents: write

jobs:
  # Nothing is published from a tree that does not pass everything, on every
  # interpreter and platform — the same job ci runs on each push.
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: the tag and __version__ have to agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os, pathlib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          have = pathlib.Path("src/astrodoro/__init__.py").read_text().split('"')[1]
          assert tag == have, f"tag {tag} against __version__ {have}"
          print(f"{tag} agrees")
          PY

  packages:
    needs: [checks, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  # One bundle per platform. Live capture needs the SVBony SDK, which is not
  # redistributable and is never bundled: on macOS the driver finds it through
  # SVB_SDK_PATH, and on Windows and Linux there is no driver at all, so those
  # two builds are the interface, the replay source and the CLI.
  app:
    needs: [checks, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: install
        run: |
          pip install --upgrade pip
          pip install -e . pyinstaller pillow

      - name: the message catalogues, which the wheel hook normally compiles
        run: |
          pip install babel
          python scripts/i18n.py compile

      - name: icon
        run: python packaging/make_icons.py

      - name: build
        run: pyinstaller packaging/astrodoro.spec --noconfirm

      - name: it has to start
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            bin="dist/Astrodoro.app/Contents/MacOS/astrodoro"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            bin="dist/astrodoro/astrodoro.exe"
          else
            bin="dist/astrodoro/astrodoro"
          fi
          "$bin" --version
          "$bin" settings | head -3

      - name: name the archive
        id: archive
        shell: bash
        run: |
          v=$(python -c "import pathlib;print(pathlib.Path('src/astrodoro/__init__.py').read_text().split('\"')[1])")
          echo "name=astrodoro-$v-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: archive
        shell: bash
        run: |
          mkdir -p out
          cd dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --keepParent Astrodoro.app "../out/${{ steps.archive.outputs.name }}.zip"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "../out/${{ steps.archive.outputs.name }}.zip" astrodoro > /dev/null
          else
            tar -czf "../out/${{ steps.archive.outputs.name }}.tar.gz" astrodoro
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: out/*

  publish:
    needs: [packages, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: staging
      - name: gather and checksum
        run: |
          mkdir -p release
          find staging -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -lh
      - name: what the release says
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          ## Downloads

          | file | for |
          | --- | --- |
          | `astrodoro-*-macos-arm64.zip` | Apple Silicon. Unzip and move Astrodoro.app to Applications |
          | `astrodoro-*-windows-x86_64.zip` | Windows 10 and 11 |
          | `astrodoro-*-linux-x86_64.tar.gz` | glibc 2.35 and newer (Ubuntu 22.04 and newer) |
          | `*.whl`, `*.tar.gz` | `pip install`, for any platform with Python 3.11+ |

          Each bundle carries its own Python and Qt, so nothing else is needed
          to open the window, replay a recorded session or run the CLI.

          **Live capture is macOS only, and needs the SVBony SDK.** The vendor
          library is not redistributable, so it is not in any of these files:
          install it separately and point `SVB_SDK_PATH` at the folder holding
          `libSVBCameraSDK.dylib`. On Windows and Linux there is no camera
          driver at all — those builds run the interface, the replay source and
          the CLI.

          The bundles are not signed. macOS will say the developer cannot be
          verified: right-click the app and choose Open the first time.

          `SHA256SUMS` covers every file above.
          EOF
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "Astrodoro $TAG" --notes-file notes.md --verify-tag
          fi
