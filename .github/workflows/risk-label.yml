name: risk-label

# Every pull request carries exactly one known risk:<level> label (checked by
# scripts/risk.py). Which level is a judgement made when the PR is opened, not
# something computed from the files it touches. It lives outside ci.yml because it must also run when a
# label changes, which would otherwise re-run the whole matrix; for the same
# reason it is not part of the Quality Report. The pr-writer agent applies the
# label when it opens the PR; `make risk-labels` creates the four labels.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  # Reads the PR's labels when the job runs.
  pull-requests: read

# Runs of the same PR queue instead of cancelling each other: opening a PR with
# its label fires `opened` and `labeled` together, and cancel-in-progress left a
# cancelled check on every PR. Dropping the group would let an older run finish
# last and decide the check. GitHub keeps one pending run per group, so 3+
# events at once (Dependabot adds three labels) still cancel the pending ones
# in between.
concurrency:
  group: risk-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  risk-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The standard library alone, not the dev extra: no install step.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the PR has exactly one known risk label
        env:
          # Through the environment, never interpolated into the script.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        # The labels come from the API, not from the event payload: the payload
        # is a snapshot of when the event fired, and `gh pr create --label` adds
        # the label in a second call, so the `opened` run of every PR saw no
        # labels (and a run from an older event could judge labels that already
        # changed).
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels?per_page=100" --jq '[.[].name]')
          python scripts/risk.py check --labels-json "$labels"
