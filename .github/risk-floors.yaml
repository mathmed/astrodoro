# Minimum risk level of a pull request, by the files it touches (added, changed,
# deleted or renamed). Read by the pr-writer agent (.claude/agents/pr-writer.md)
# and by scripts/risk.py, which the risk-label workflow runs to check that the
# PR's risk:<level> label is not below the floor.
#
# Patterns are repository-relative: `*` matches inside one path segment, `**`
# any number of segments. Levels: low, medium, high, critical. The other floor
# (any deploy step other than "None" is at least medium) depends on the PR
# description, so only the pr-writer agent applies it.
#
# Lowering a level or removing a path relaxes a gate: it needs the owner's
# approval, asked for in the PR, like an import contract.
floors:
  # What decides which checks run and how: a change here can switch a gate off
  # without touching a line of the program. uv.lock pins the versions of every
  # checker; CONTRIBUTING.md is the rulebook agents follow, as CLAUDE.md is in
  # other repositories (here CLAUDE.md is local to each clone and gitignored).
  - category: pipeline config
    level: high
    paths:
      - pyproject.toml
      - uv.lock
      - .pre-commit-config.yaml
      - Makefile
      - suppressions-baseline.json
      - hatch_build.py
      - packaging/**
      - scripts/**
      - .github/**
      - .claude/**
      - CONTRIBUTING.md
      - CLAUDE.md
      - AGENTS.md

  # There is no database. What a later version reads back from disk plays the
  # part of a migration: the settings file, the recorded sessions that replay
  # opens, and the names and headers of the calibration masters matched
  # against each night's capture.
  - category: migrations and persistent formats
    level: high
    paths:
      - "**/migrations/**"
      - src/astrodoro/settings.py
      - src/astrodoro/core/recorder.py
      - src/astrodoro/core/source.py
      - src/astrodoro/core/masters.py

  # No login exists, but the phone link generates and keeps a TLS private key
  # and serves on the local network.
  - category: auth and secrets
    level: high
    paths:
      - "**/*auth*"
      - "**/*auth*/**"
      - "**/*permission*"
      - "**/*permission*/**"
      - "**/*secret*"
      - "**/*credential*"
      - src/astrodoro/pointing/handset.py

  # ctypes bindings to a closed vendor SDK and the binaries themselves: a wrong
  # signature corrupts memory, and nothing in CI has the camera to notice.
  - category: camera SDK bindings
    level: high
    paths:
      - src/astrodoro/drivers/svbony/**
      - vendor/**

  # The frames a user stacks pass through here, and the capture thread drives
  # the camera between exposures.
  - category: capture and stacking core
    level: medium
    paths:
      - src/astrodoro/core/**
      - src/astrodoro/drivers/**
      - src/astrodoro/ui/worker.py
