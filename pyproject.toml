[project]
name = "astrodoro"
# Single-sourced from src/astrodoro/__init__.py, so `astrodoro --version` and
# the wheel can never disagree. They once did, by a minor version, and only a
# wheel build would have shown it.
dynamic = ["version"]
description = "Capture and live stacking for electronically assisted astronomy on macOS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Mateus Medeiros" }]
keywords = ["astronomy", "eaa", "live-stacking", "astrophotography", "svbony"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6.0",
    # Headless: nothing here opens a cv2 window (imwrite and the array
    # operations only), and the desktop build ships Qt5 plugins that
    # hijack QT_QPA_PLATFORM_PLUGIN_PATH on import and break the Qt6 UI.
    "opencv-python-headless>=4.9",
    "astroalign>=2.5",
    # sep comes in transitively through astroalign, but core/stars.py imports it
    # directly, so it is declared.
    "sep>=1.2",
    # The full PySide6, not Essentials, despite the ~800 MB. Tried and reverted:
    # Essentials has no QtMultimedia (used by the focus beeps) and pyqtgraph
    # breaks because it expects PySide6.__version__, which only the umbrella
    # package defines. Working around both would be two fragile patches in a
    # program that runs in the field.
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "vulture>=2.11",
    "xenon>=0.9",
    "pre-commit>=3.7",
    # Extraction, merging and compilation of the message catalogues. Pure
    # Python, so `make i18n` needs no system gettext — which macOS does not
    # ship.
    "babel>=2.18",
    # Coverage is reported in CI (the Quality Report), not enforced.
    "pytest-cov>=7.1",
    "import-linter>=2.15",
    # mutmut forks for every mutant and does not run on Windows, where the
    # matrix still installs the dev extra.
    "mutmut>=3.8.0; sys_platform != 'win32'",
]

[project.urls]
Homepage = "https://github.com/mathmed/astrodoro"
Issues = "https://github.com/mathmed/astrodoro/issues"

[project.scripts]
astrodoro = "astrodoro.cli:main"

[project.gui-scripts]
astrodoro-gui = "astrodoro.ui:main"

[build-system]
# Babel is a build dependency because the wheel compiles the .mo catalogues
# from the committed .po files — see hatch_build.py.
requires = ["hatchling", "babel>=2.18"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/astrodoro/__init__.py"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# Everything under the package directory ships, the handset page, the icon and
# the translation catalogues included. No force-include: those files already
# live inside the package, and listing them again makes hatchling fail with
# "a second file is being added at the same path".
#
# Their PNG and .po extensions survive because .gitignore negates them
# explicitly — hatchling honours the ignore file, so a broad `*.png` rule would
# silently drop the icon from the wheel.
packages = ["src/astrodoro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ is not a package; its tests import it from the repository root.
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # bin3/bin4 raise a deliberate RuntimeWarning; a test may exercise it.
    "ignore:bin.:RuntimeWarning",
]

[tool.ruff]
line-length = 88
src = ["src", "tests", "scripts"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import order
    "B",         # bugbear
    "UP",        # pyupgrade
    "C4",        # comprehensions
    "RUF",
]
ignore = [
    # `bin` shadows a builtin, but it is the camera's own parameter name and
    # renaming it would diverge from the SDK and from every FITS header.
    "A002",
    # Bare-ish excepts around hardware and Qt teardown are deliberate and
    # commented at each site.
    "BLE001",
    # Ambiguous unicode in strings: the interface uses ° ' " and arrows on
    # purpose.
    "RUF001", "RUF002", "RUF003",
    # `int(round(x))` looks redundant but is not: round() on a numpy scalar
    # returns a numpy scalar, and only the int() makes it usable as an index.
    "RUF046",
]

[tool.ruff.lint.per-file-ignores]
# The embedded star and constellation tables are data, not code to be reflowed.
"src/astrodoro/pointing/brightstars.py" = ["E501"]
"src/astrodoro/pointing/constellations.py" = ["E501"]
# Tests use assert and long explanatory messages.
"tests/*" = ["E501"]

[tool.mypy]
# No python_version here on purpose: it must match the interpreter the
# checks run on, and numpy's stubs can differ between versions. CI runs
# every supported version instead.
ignore_missing_imports = true
files = ["src/astrodoro"]

[tool.vulture]
min_confidence = 80
paths = ["src/astrodoro"]

[tool.bandit]
# B310: urlopen with a URL the program builds. Both sites are fixed https
# endpoints — the OpenNGC catalogue and the DSS cutout server — and there is no
# user input in either.
skips = ["B310"]

# The layering CONTRIBUTING.md describes, as contracts `lint-imports` enforces.
# Relaxing one — a new ignore_imports line, a layer moved, a module let off a
# forbidden list — is an architecture change and needs the owner's approval.
[tool.importlinter]
root_package = "astrodoro"
# Needed to forbid third-party packages (Qt) and not only our own modules.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "one-way layering: front ends > pointing > core > drivers > settings, i18n"
type = "layers"
layers = [
    "astrodoro.ui | astrodoro.cli",
    "astrodoro.pointing",
    "astrodoro.core",
    "astrodoro.drivers",
    "astrodoro.settings | astrodoro.i18n",
]

[[tool.importlinter.contracts]]
name = "the core, drivers, settings and i18n know nothing of Qt"
type = "forbidden"
source_modules = [
    "astrodoro.core",
    "astrodoro.drivers",
    "astrodoro.settings",
    "astrodoro.i18n",
]
forbidden_modules = ["PySide6", "pyqtgraph"]

[[tool.importlinter.contracts]]
name = "the CLI stays headless"
type = "forbidden"
source_modules = ["astrodoro.cli"]
forbidden_modules = ["PySide6", "pyqtgraph"]

[[tool.importlinter.contracts]]
name = "in pointing, Qt lives in handset.py alone"
type = "forbidden"
source_modules = [
    "astrodoro.pointing.brightstars",
    "astrodoro.pointing.constellations",
    "astrodoro.pointing.model",
    "astrodoro.pointing.orientation",
    "astrodoro.pointing.pushto",
]
forbidden_modules = ["PySide6", "pyqtgraph"]

[[tool.importlinter.contracts]]
name = "nothing above drivers names a vendor"
type = "forbidden"
source_modules = [
    "astrodoro.core",
    "astrodoro.pointing",
    "astrodoro.ui",
    "astrodoro.cli",
]
forbidden_modules = ["astrodoro.drivers.svbony"]
# drivers.camera() imports the vendor module itself; that path is the point.
allow_indirect_imports = true

# Mutation testing over the decision logic only: which master applies, how the
# polar error is read, how the Moon and planets are measured and cut, how the
# sky is ranked and where the arrow points. The pixel pipeline (stars,
# register, stacker) is numerics around OpenCV and sep with suites of tens of
# seconds per run, and drivers, ui, cli, I/O and the embedded tables are not
# rules. `make mutation` runs it; CI runs it weekly, never as a PR gate.
[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/astrodoro/core/calibration.py",
    "src/astrodoro/core/platform_align.py",
    "src/astrodoro/core/lucky.py",
    "src/astrodoro/core/lucky_stack.py",
    "src/astrodoro/core/tonight.py",
    "src/astrodoro/pointing/pushto.py",
    "src/astrodoro/pointing/orientation.py",
]
pytest_add_cli_args_test_selection = [
    "tests/core/test_calibration.py",
    "tests/core/test_platform_align.py",
    "tests/core/test_lucky.py",
    "tests/core/test_lucky_stack.py",
    "tests/core/test_tonight.py",
    "tests/pointing/test_pushto.py",
    "tests/pointing/test_orientation.py",
]
