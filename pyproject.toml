[project]
name = "astrodoro"
# Single-sourced from src/astrodoro/__init__.py, so `astrodoro --version` and
# the wheel can never disagree. They once did, by a minor version, and only a
# wheel build would have shown it.
dynamic = ["version"]
description = "Capture and live stacking for electronically assisted astronomy on macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Mateus Medeiros" }]
keywords = ["astronomy", "eaa", "live-stacking", "astrophotography", "svbony"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6.0",
    # Headless: nothing here opens a cv2 window (imwrite and the array
    # operations only), and the desktop build ships Qt5 plugins that
    # hijack QT_QPA_PLATFORM_PLUGIN_PATH on import and break the Qt6 UI.
    "opencv-python-headless>=4.9",
    "astroalign>=2.5",
    # sep comes in transitively through astroalign, but core/stars.py imports it
    # directly, so it is declared.
    "sep>=1.2",
    # The full PySide6, not Essentials, despite the ~800 MB. Tried and reverted:
    # Essentials has no QtMultimedia (used by the focus beeps) and pyqtgraph
    # breaks because it expects PySide6.__version__, which only the umbrella
    # package defines. Working around both would be two fragile patches in a
    # program that runs in the field.
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "vulture>=2.11",
    "xenon>=0.9",
    "pre-commit>=3.7",
    # Extraction, merging and compilation of the message catalogues. Pure
    # Python, so `make i18n` needs no system gettext — which macOS does not
    # ship.
    "babel>=2.18",
]

[project.urls]
Homepage = "https://github.com/mathmed/astrodoro"
Issues = "https://github.com/mathmed/astrodoro/issues"

[project.scripts]
astrodoro = "astrodoro.cli:main"

[project.gui-scripts]
astrodoro-gui = "astrodoro.ui:main"

[build-system]
# Babel is a build dependency because the wheel compiles the .mo catalogues
# from the committed .po files — see hatch_build.py.
requires = ["hatchling", "babel>=2.18"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/astrodoro/__init__.py"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# Everything under the package directory ships, the handset page, the icon and
# the translation catalogues included. No force-include: those files already
# live inside the package, and listing them again makes hatchling fail with
# "a second file is being added at the same path".
#
# Their PNG and .po extensions survive because .gitignore negates them
# explicitly — hatchling honours the ignore file, so a broad `*.png` rule would
# silently drop the icon from the wheel.
packages = ["src/astrodoro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # bin3/bin4 raise a deliberate RuntimeWarning; a test may exercise it.
    "ignore:bin.:RuntimeWarning",
]

[tool.ruff]
line-length = 88
src = ["src", "tests", "scripts"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import order
    "B",         # bugbear
    "UP",        # pyupgrade
    "C4",        # comprehensions
    "RUF",
]
ignore = [
    # `bin` shadows a builtin, but it is the camera's own parameter name and
    # renaming it would diverge from the SDK and from every FITS header.
    "A002",
    # Bare-ish excepts around hardware and Qt teardown are deliberate and
    # commented at each site.
    "BLE001",
    # Ambiguous unicode in strings: the interface uses ° ' " and arrows on
    # purpose.
    "RUF001", "RUF002", "RUF003",
    # `int(round(x))` looks redundant but is not: round() on a numpy scalar
    # returns a numpy scalar, and only the int() makes it usable as an index.
    "RUF046",
]

[tool.ruff.lint.per-file-ignores]
# The embedded star and constellation tables are data, not code to be reflowed.
"src/astrodoro/pointing/brightstars.py" = ["E501"]
"src/astrodoro/pointing/constellations.py" = ["E501"]
# Tests use assert and long explanatory messages.
"tests/*" = ["E501"]

[tool.mypy]
ignore_missing_imports = true
files = ["src/astrodoro"]

[tool.vulture]
min_confidence = 80
paths = ["src/astrodoro"]

[tool.bandit]
# B310: urlopen with a URL the program builds. Both sites are fixed https
# endpoints — the OpenNGC catalogue and the DSS cutout server — and there is no
# user input in either.
skips = ["B310"]
